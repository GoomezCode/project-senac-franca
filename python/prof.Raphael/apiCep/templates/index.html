<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
}

/* HEADER */
.header {
    background: #020617;
    padding: 15px 25px;
    border-bottom: 1px solid #334155;
}

.header h1 {
    color: #3fa0ff;
}

/* LAYOUT */
.main {
    display: flex;
    justify-content: center;
    align-items: center;
    height: calc(100vh - 70px);
    padding: 20px;
}

/* CARDS */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 800px;
}

.card {
    background: #1e293b;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
    border: 1px solid #334155;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 20px rgba(63,160,255,0.3);
    border-color: #3fa0ff;
}

.card h2 {
    margin-bottom: 10px;
    color: #93c5fd;
}

.card p {
    color: #94a3b8;
    font-size: 14px;
}

/* BOTÃO */
.btn {
    margin-top: 15px;
    display: inline-block;
    padding: 10px 15px;
    background: #185FA5;
    color: white;
    border-radius: 10px;
    text-decoration: none;
    transition: 0.3s;
}

.btn:hover {
    background: #0C447C;
}

/* RESPONSIVO */
@media(max-width: 500px) {
    .header h1 {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>🚀 Meu Sistema Flask</h1>
</div>

<div class="main">
    <div class="grid">

        <!-- CEP -->
        <div class="card" onclick="goTo('/window/buscarCep')">
            <h2>📍 Buscar CEP</h2>
            <p>Consulta endereço completo através do CEP</p>
            <span class="btn">Acessar</span>
        </div>

        <!-- CNPJ -->
        <div class="card" onclick="goTo('/window/buscarCnpj')">
            <h2>🏢 Buscar CNPJ</h2>
            <p>Consulta dados completos de empresas</p>
            <span class="btn">Acessar</span>
        </div>

    </div>
</div>

<script>
function goTo(url) {
    window.location.href = url;
}
</script>

</body>
</html>
